# Builds the APK on GitHub and publishes a public download link:
# https://github.com/renaldibosco/bible/releases/latest/download/HolyBible.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Tamil and Odia Bible text (eBible.org, CC BY-SA 4.0)
        run: |
          set -o pipefail
          mkdir -p src
          curl -fsSL --retry 3 -o src/tam2017_usfm.zip https://ebible.org/Scriptures/tam2017_usfm.zip 2>&1 | tee -a build.log
          curl -fsSL --retry 3 -o src/ory_usfm.zip https://ebible.org/Scriptures/ory_usfm.zip 2>&1 | tee -a build.log
          python3 tools/build_data.py usfm ta src/tam2017_usfm.zip 2>&1 | tee -a build.log
          python3 tools/build_data.py usfm or src/ory_usfm.zip 2>&1 | tee -a build.log
          python3 tools/build_data.py check 2>&1 | tee -a build.log
      - name: Build APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log
          cp app/build/outputs/apk/debug/app-debug.apk HolyBible.apk
          ls -la HolyBible.apk | tee -a build.log
      - name: Save build log
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          { grep -E '^(en|ta|or|note|FAIL)[ :]' build.log; echo '--- errors ---'; grep -E '^e: |error:|FAILED' build.log; echo '--- tail ---'; tail -n 40 build.log; } > build-result.log || true
          git add -f build-result.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin build-log
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Holy Bible v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Holy Bible — KJV English, Tamil (IRV) and Odia (IRV), with read-aloud.
            Download **HolyBible.apk** below and open it on your Android phone.
          files: HolyBible.apk
